<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tsubuyaki | ろくふぁめ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖋%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #141414;
  --line: #2a2a2a;
  --text: #ececec;
  --muted: #9a9a9a;
  --accent: #8fd6ea;
  --header-h: 56px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
  line-height: 1.8;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 20;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}

/* ---- header ---- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1080px; margin: 0 auto; padding: 0 20px;
  height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
}
.site-name {
  color: var(--text); text-decoration: none;
  font-size: 1.15rem; font-weight: 700; letter-spacing: .02em;
}
.nav { display: flex; align-items: center; gap: 4px; margin: 0; padding: 0; list-style: none; }
.nav > li { position: relative; }
.nav a, .nav button {
  display: block; padding: 8px 12px; border-radius: 6px;
  font: inherit; font-size: .95rem; color: var(--muted);
  background: var(--bg); border: 0; cursor: pointer; text-decoration: none;
}
.nav a:hover, .nav button:hover, .nav button[aria-expanded="true"] { color: var(--text); }
.nav a:focus-visible, .nav button:focus-visible, .site-name:focus-visible, .menu-toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.nav button::after {
  content: ""; display: inline-block; margin-left: 8px; vertical-align: 2px;
  width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg); transition: transform .15s;
}
.nav button[aria-expanded="true"]::after { transform: rotate(225deg); vertical-align: -1px; }
.has-drop { display: flex; align-items: center; }
.has-drop > a { padding-right: 4px; }
.nav .drop-toggle { padding: 8px 10px 8px 2px; }
.nav .drop-toggle::after { margin-left: 0; }
.nav .settings::after { content: none; }

.dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 190px;
  margin: 0; padding: 6px; list-style: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  display: none;
}
.dropdown.right { left: auto; right: 0; }
.has-drop.open > .dropdown { display: block; }
.dropdown a { color: var(--text); background: transparent; }
.dropdown a:hover { background: #222; }
.nav .settings {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; margin-left: 8px;
  color: var(--muted); border: 1px solid var(--line);
}
.nav .settings svg { width: 18px; height: 18px; }
.nav .settings:hover { color: var(--text); }
.nav .settings:hover { border-color: var(--accent); }

.menu-toggle { display: none; }

/* ---- hero ---- */
.hero { position: relative; height: 160svh; overflow: hidden; }
.group { position: absolute; display: flex; gap: 1.4rem; }
.g1 { top: 14svh; left: 5vw; align-items: flex-end; }
.g2 { top: 56svh; right: 5vw; flex-direction: column; align-items: flex-end; gap: .6rem; }
.g3 { top: 100svh; left: 5vw; align-items: flex-end; }
.msg {
  margin: 0; padding: .1em; max-width: 14em;
  font-size: clamp(2.1rem, 7.2vw, 6.4rem);
  font-weight: 800; line-height: 1.3; letter-spacing: .03em; color: #fff;
}
.g2 .msg { text-align: right; padding-right: 0; margin-right: -.03em; }
.sub { margin: 0; max-width: 16em; font-size: .85rem; line-height: 1.8; color: var(--muted); }
.g2 .sub { text-align: right; }
.js .sub { opacity: 0; transition: opacity .9s ease; }
.js .msg.in ~ .sub { opacity: 1; }
.js .g1 .sub { transition-delay: 1.3s; }
.js .g2 .sub { transition-delay: 2.3s; }
.js .g3 .sub { transition-delay: 1s; }
@media (max-width: 760px) {
  .g1, .g3 { flex-direction: column; align-items: flex-start; gap: .4rem; }
}
.note { position: absolute; top: 20px; left: 0; right: 0; text-align: center; margin: 0; font-size: .8rem; color: var(--muted); }
.js .msg { clip-path: inset(0 100% 0 0); transition: clip-path 1.2s cubic-bezier(.2, .8, .2, 1); }
.js .msg.m1 { transition-delay: .3s; }
.js .msg.m2 { clip-path: inset(0 0 0 100%); transition-delay: 1.2s; }
.js .msg.in { clip-path: inset(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .js .msg, .js .sub { transition: none; } }

/* ---- mobile ---- */
@media (max-width: 760px) {
  .menu-toggle {
    display: block; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .nav {
    display: none; position: absolute; left: 0; right: 0; top: var(--header-h);
    flex-direction: column; align-items: stretch; gap: 0; padding: 8px 20px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .site-header.menu-open .nav { display: flex; }
  .nav > li { width: 100%; }
  .nav a, .nav button { width: 100%; text-align: left; padding: 12px 8px; }
  .has-drop { flex-wrap: wrap; }
  .has-drop > a { flex: 1; width: auto; padding-right: 8px; }
  .nav .drop-toggle { width: 48px; padding: 12px 0; text-align: center; }
  .has-drop > .dropdown { width: 100%; }
  .dropdown, .dropdown.right { position: static; border: 0; padding: 0 0 0 12px; background: none; }
  .nav .settings { margin: 8px 0 0; width: 100%; }
}


/* ---- about ---- */
.nav a[aria-current="page"] { color: var(--text); }
.about { max-width: 960px; margin: 0 auto; padding: 72px 20px 160px; }
.about h1 {
  margin: 0 0 24px; color: #fff; font-weight: 800; line-height: 1;
  font-size: clamp(3rem, 10vw, 6.5rem); letter-spacing: .02em;
}
.about .lead { margin: 0 0 72px; max-width: 28em; font-size: clamp(1.1rem, 2.4vw, 1.6rem); line-height: 1.7; }

/* ---- tsubuyaki ---- */
.about h1 { margin-bottom: 56px; }
.tw-month, .tw-day { border-top: 1px solid var(--line); }
.tw-month:last-child { border-bottom: 1px solid var(--line); }
.tw-month > summary, .tw-day > summary {
  display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.tw-month > summary::-webkit-details-marker, .tw-day > summary::-webkit-details-marker { display: none; }
.tw-month > summary::before, .tw-day > summary::before {
  content: ""; flex: none; width: 7px; height: 7px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); transition: transform .15s;
}
.tw-month[open] > summary::before, .tw-day[open] > summary::before { transform: rotate(45deg); }
.tw-month > summary { padding: 22px 0; font-size: 1.2rem; font-weight: 700; color: #fff; }
.tw-day > summary { padding: 14px 0 14px 20px; font-size: .95rem; color: var(--muted); }
.tw-month > summary:hover, .tw-day > summary:hover { color: var(--accent); }
.tw-month > summary:focus-visible, .tw-day > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tw-count { margin-left: auto; font-size: .8rem; font-weight: 400; color: var(--muted); }
.tw-days { padding: 0 0 12px 20px; }
.tw-post { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: baseline; padding: 10px 0 10px 40px; }
.tw-post time { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; color: var(--muted); }
.tw-post p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.tw-empty { color: var(--muted); }
@media (max-width: 760px) {
  .tw-days { padding-left: 8px; }
  .tw-day > summary { padding-left: 12px; }
  .tw-post { grid-template-columns: 1fr; gap: 2px; padding-left: 32px; }
}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="bar">
    <a class="site-name" href="../index.html">ろくふぁめ</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mainNav">メニュー</button>
    <ul class="nav" id="mainNav">
      <li><a href="../about.html">About</a></li>

<main class="about">
  <h1>Tsubuyaki</h1>

  <!-- つぶやきは tsubuyaki.json に追加する -->
  <div id="tsubuyaki"></div>
</main>

<script>

(function () {
  var header = document.getElementById('siteHeader');
  var toggle = header.querySelector('.menu-toggle');
  var drops = header.querySelectorAll('.has-drop');

  function closeAll(except) {
    drops.forEach(function (li) {
      if (li === except) return;
      li.classList.remove('open');
      li.querySelector('button').setAttribute('aria-expanded', 'false');
    });
  }

  drops.forEach(function (li) {
    var btn = li.querySelector('button');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = !li.classList.contains('open');
      closeAll(li);
      li.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
    });
  });

  toggle.addEventListener('click', function () {
    var open = !header.classList.contains('menu-open');
    header.classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('click', function () { closeAll(null); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
})();
</script>
<script>
// つぶやきを読み込んで「月 → 日付」ごとに並べる
(function () {
  var root = document.getElementById('tsubuyaki');
  var WEEK = '日月火水木金土';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // HTMLとしては解釈しない
    return e;
  }

  fetch('tsubuyaki.json', { cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(render)
    .catch(function () {
      root.appendChild(el('p', 'tw-empty', 'つぶやきを読み込めませんでした。'));
    });

  function render(posts) {
    if (!posts.length) { root.appendChild(el('p', 'tw-empty', 'まだつぶやきはありません。')); return; }

    // 新しい順に並べて、{ "2026-11": { "2026-11-25": [...] } } にまとめる
    posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
    var byMonth = {}, months = [];
    posts.forEach(function (p) {
      var m = p.date.slice(0, 7), d = p.date.slice(0, 10);
      if (!byMonth[m]) { byMonth[m] = {}; months.push(m); }
      (byMonth[m][d] = byMonth[m][d] || []).push(p);
    });

    months.forEach(function (m, mi) {
      var days = Object.keys(byMonth[m]);
      var total = days.reduce(function (n, d) { return n + byMonth[m][d].length; }, 0);

      var month = el('details', 'tw-month');
      month.open = mi === 0; // 一番新しい月だけ開いておく
      var ms = el('summary', null, m.slice(0, 4) + '年' + Number(m.slice(5, 7)) + '月');
      ms.appendChild(el('span', 'tw-count', total + '件'));
      month.appendChild(ms);

      var wrap = el('div', 'tw-days');
      days.forEach(function (d, di) {
        var w = WEEK[new Date(d + 'T00:00').getDay()];
        var day = el('details', 'tw-day');
        day.open = mi === 0 && di === 0; // 一番新しい日だけ開いておく
        var ds = el('summary', null, Number(d.slice(8, 10)) + '日（' + w + '）');
        ds.appendChild(el('span', 'tw-count', byMonth[m][d].length + '件'));
        day.appendChild(ds);
        byMonth[m][d].forEach(function (p) {
          var row = el('div', 'tw-post');
          var t = el('time', null, p.date.slice(11, 16));
          t.setAttribute('datetime', p.date);
          row.appendChild(t);
          row.appendChild(el('p', null, p.text));
          day.appendChild(row);
        });
        wrap.appendChild(day);
      });
      month.appendChild(wrap);
      root.appendChild(month);
    });
  }
})();
</script>
</body>
