<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サイト名</title>
<script>document.documentElement.classList.add('js');</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖋%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #141414;
  --line: #2a2a2a;
  --text: #ececec;
  --muted: #9a9a9a;
  --accent: #8fd6ea;
  --header-h: 56px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
  line-height: 1.8;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 20;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}

/* ---- header ---- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1080px; margin: 0 auto; padding: 0 20px;
  height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
}
.site-name {
  color: var(--text); text-decoration: none;
  font-size: 1.15rem; font-weight: 700; letter-spacing: .02em;
}
.nav { display: flex; align-items: center; gap: 4px; margin: 0; padding: 0; list-style: none; }
.nav > li { position: relative; }
.nav a, .nav button {
  display: block; padding: 8px 12px; border-radius: 6px;
  font: inherit; font-size: .95rem; color: var(--muted);
  background: var(--bg); border: 0; cursor: pointer; text-decoration: none;
}
.nav a:hover, .nav button:hover, .nav button[aria-expanded="true"] { color: var(--text); }
.nav a:focus-visible, .nav button:focus-visible, .site-name:focus-visible, .menu-toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.nav button::after {
  content: ""; display: inline-block; margin-left: 8px; vertical-align: 2px;
  width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg); transition: transform .15s;
}
.nav button[aria-expanded="true"]::after { transform: rotate(225deg); vertical-align: -1px; }
.has-drop { display: flex; align-items: center; }
.has-drop > a { padding-right: 4px; }
.nav .drop-toggle { padding: 8px 10px 8px 2px; }
.nav .drop-toggle::after { margin-left: 0; }
.nav .settings::after { content: none; }

.dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 190px;
  margin: 0; padding: 6px; list-style: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  display: none;
}
.dropdown.right { left: auto; right: 0; }
.has-drop.open > .dropdown { display: block; }
.dropdown a { color: var(--text); background: transparent; }
.dropdown a:hover { background: #222; }
.nav .settings {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; margin-left: 8px;
  color: var(--muted); border: 1px solid var(--line);
}
.nav .settings svg { width: 18px; height: 18px; }
.nav .settings:hover { color: var(--text); }
.nav .settings:hover { border-color: var(--accent); }

.menu-toggle { display: none; }

/* ---- hero ---- */
.hero { position: relative; height: 160svh; overflow: hidden; }
.group { position: absolute; display: flex; gap: 1.4rem; }
.g1 { top: 14svh; left: 5vw; align-items: flex-end; }
.g2 { top: 56svh; right: 5vw; flex-direction: column; align-items: flex-end; gap: .6rem; }
.g3 { top: 100svh; left: 5vw; align-items: flex-end; }
.msg {
  margin: 0; padding: .1em; max-width: 14em;
  font-size: clamp(2.1rem, 7.2vw, 6.4rem);
  font-weight: 800; line-height: 1.3; letter-spacing: .03em; color: #fff;
}
.g2 .msg { text-align: right; }
.sub { margin: 0; max-width: 16em; font-size: .85rem; line-height: 1.8; color: var(--muted); }
.g2 .sub { text-align: right; }
.js .sub { opacity: 0; transition: opacity .9s ease; }
.js .msg.in ~ .sub { opacity: 1; }
.js .g1 .sub { transition-delay: 1.3s; }
.js .g2 .sub { transition-delay: 2.3s; }
.js .g3 .sub { transition-delay: 1s; }
@media (max-width: 760px) {
  .g1, .g3 { flex-direction: column; align-items: flex-start; gap: .4rem; }
}
.note { position: absolute; top: 20px; left: 0; right: 0; text-align: center; margin: 0; font-size: .8rem; color: var(--muted); }
.js .msg { clip-path: inset(0 100% 0 0); transition: clip-path 1.2s cubic-bezier(.2, .8, .2, 1); }
.js .msg.m1 { transition-delay: .3s; }
.js .msg.m2 { clip-path: inset(0 0 0 100%); transition-delay: 1.2s; }
.js .msg.in { clip-path: inset(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .js .msg, .js .sub { transition: none; } }

/* ---- mobile ---- */
@media (max-width: 760px) {
  .menu-toggle {
    display: block; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .nav {
    display: none; position: absolute; left: 0; right: 0; top: var(--header-h);
    flex-direction: column; align-items: stretch; gap: 0; padding: 8px 20px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .site-header.menu-open .nav { display: flex; }
  .nav > li { width: 100%; }
  .nav a, .nav button { width: 100%; text-align: left; padding: 12px 8px; }
  .has-drop { flex-wrap: wrap; }
  .has-drop > a { flex: 1; width: auto; padding-right: 8px; }
  .nav .drop-toggle { width: 48px; padding: 12px 0; text-align: center; }
  .has-drop > .dropdown { width: 100%; }
  .dropdown, .dropdown.right { position: static; border: 0; padding: 0 0 0 12px; background: none; }
  .nav .settings { margin: 8px 0 0; width: 100%; }
}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="bar">
    <a class="site-name" href="index.html">サイト名</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mainNav">メニュー</button>
    <ul class="nav" id="mainNav">
      <li><a href="about.html">About</a></li>
      <li><a href="notes/index.html" title="備忘録">Notes</a></li>
      <li class="has-drop">
        <a href="knowledge/index.html" title="知識（やったこと）">Knowledge</a>
        <button type="button" class="drop-toggle" aria-label="Knowledgeのメニューを開く" aria-expanded="false" aria-haspopup="true"></button>
        <ul class="dropdown">
          <li><a href="knowledge/web.html">Web</a></li>
          <li><a href="knowledge/low-level.html">低レイヤ</a></li>
        </ul>
      </li>
      <li><a href="projects.html">Projects</a></li>
      <li class="has-drop">
        <a href="link/index.html">Link</a>
        <button type="button" class="drop-toggle" aria-label="Linkのメニューを開く" aria-expanded="false" aria-haspopup="true"></button>
        <ul class="dropdown right">
          <li><a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a></li>
          <li><a href="https://x.com/" target="_blank" rel="noopener noreferrer">X</a></li>
        </ul>
      </li>
      <li>
        <button type="button" class="settings" aria-label="サイト設定" title="サイト設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </li>
    </ul>
  </div>
</header>

<main class="hero">
  <p class="note">こちらはろくふぁめのページです。</p>
  <div class="group g1">
    <p class="msg m1">基盤を知り<br>積み上げていく</p>
    <p class="sub">今の私は過去の積み上げてきた結果だ。</p>
  </div>
  <div class="group g2">
    <p class="msg m2">全てを言葉にし肯定しろ</p>
    <p class="sub">さらなる自己理解、そして自己創造へ。</p>
  </div>
  <div class="group g3">
    <p class="msg m3">多くのことを<br>ここに残す。</p>
    <p class="sub">独りよがりな自分が社会に貢献するために。</p>
  </div>
</main>

<script>
(function () {
  var header = document.getElementById('siteHeader');
  var toggle = header.querySelector('.menu-toggle');
  var drops = header.querySelectorAll('.has-drop');

  function closeAll(except) {
    drops.forEach(function (li) {
      if (li === except) return;
      li.classList.remove('open');
      li.querySelector('button').setAttribute('aria-expanded', 'false');
    });
  }

  drops.forEach(function (li) {
    var btn = li.querySelector('button');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = !li.classList.contains('open');
      closeAll(li);
      li.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
    });
  });

  toggle.addEventListener('click', function () {
    var open = !header.classList.contains('menu-open');
    header.classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('click', function () { closeAll(null); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
})();
</script>
<script>
(function () {
  var els = document.querySelectorAll('.msg');
  if (!('IntersectionObserver' in window)) {
    els.forEach(function (e) { e.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.6, rootMargin: '0px 0px -10% 0px' });
  els.forEach(function (e) { io.observe(e); });
})();
</script>
</body>
</html>
